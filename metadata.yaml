desc: 让 AI 角色拥有真实时间感。当 AI 说去泡咖啡/做饭/查资料等需要等待的动作时，后台自动创建任务链推进时间，中途主动互动找话题，到点自然回场。解决了聊天机器"说了就等于做了"的沉浸感缺失。
short_desc: 为 AI 角色赋予真实时间感，让角色扮演中的等待不再空洞
